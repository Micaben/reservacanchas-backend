@if (pago) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(pago.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="pagoDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmar operación de borrado</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p id="jhi-delete-pago-heading" jhiTranslate="reservadecanchasApp.pago.delete.question" [translateValues]="{ id: pago.id }">
        ¿Seguro que quiere eliminar Pago {{ pago.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
      </button>

      <button id="jhi-confirm-delete-pago" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Eliminar</span>
      </button>
    </div>
  </form>
}
